  const input = document.getElementById(`fileInput-${album}`);

      const path = `${IMAGE_FOLDER}/${album}/${encodeURIComponent(file.name)}`;
      
      // Check SHA

        headers: { Authorization: `token ${token}`, "User-Agent": "AdminPanel" }

      if (checkResp.status === 200) sha = (await checkResp.json()).sha;

      // Upload

async function deleteImage(path, album) {
  if (!confirm("Delete this image?")) return;

  const status = document.getElementById(`status-${album}`);
  status.innerText = "Deleting...";
  try {
    const { token, repo, branch } = await getToken();

    // Optimistically remove from UI
    const imgDiv = document.querySelector(`.image-item[data-path='${path}']`);
    if (imgDiv) imgDiv.remove();

    // Get SHA from GitHub
    const shaResp = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`, {
      headers: { Authorization: `token ${token}`, "User-Agent":"AdminPanel" }
    });
    const sha = (await shaResp.json()).sha;

    // Delete file
    await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      method: "DELETE",
      headers: { Authorization: `token ${token}`, "User-Agent":"AdminPanel", "Content-Type":"application/json" },
      body: JSON.stringify({ message:`Delete ${path}`, branch, sha })
    });

    // Wait a moment for GitHub to process

    status.innerText = "Deleted!";
    loadAlbumImages(album); // refresh to ensure sync

    status.innerText = "Error: " + err.message;
    status.classList.add("error");

}
