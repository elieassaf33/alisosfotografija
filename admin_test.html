<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Photo Panel</title>
<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:2rem; }
h2,h3,h4 { color:#333; }
.container { max-width: 1000px; margin:auto; }
input, select, button { padding:8px; margin:5px 0; font-size:1rem; }
button { cursor:pointer; border:none; border-radius:4px; background:#007BFF; color:white; transition:0.2s; }
button:hover { background:#0056b3; }
#dropArea { border:2px dashed #aaa; border-radius:6px; padding:30px; text-align:center; margin-bottom:20px; background:white; transition:0.2s; }
#dropArea.dragover { border-color:#007BFF; background:#e0f0ff; }
.existingPhotos { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap:10px; margin-bottom:1rem; }
.card { background:white; padding:5px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); position:relative; overflow:hidden; }
.card img { width:100%; height:100px; object-fit:cover; border-radius:4px; }
.card button { position:absolute; top:5px; right:5px; background:red; font-size:0.8rem; padding:3px 6px; border-radius:4px; color:white; cursor:pointer; opacity:0.8; transition:0.2s; }
.card button:hover { opacity:1; }
.status { margin-top:10px; font-weight:bold; }
.album { background:#fff; padding:10px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); margin-bottom:2rem; }
</style>
</head>
<body>
<div class="container">
<h2>Admin Photo Panel</h2>

<h3>Select Theme</h3>
<select id="themeSelect">
  <option value="studio">Studio</option>
  <option value="portrait">Portrait</option>
  <option value="events">Events</option>
  <option value="family">Family</option>
</select>

<h3>Album Options</h3>
<input id="albumName" type="text" placeholder="Album name (optional)"/>
<button id="loadAlbumBtn">Load Specific Album</button>
<button id="loadAllAlbumsBtn">Load All Albums for Theme</button>

<h3>Upload Photos</h3>
<div id="dropArea">Drag & Drop files/folder here or click to select</div>
<input id="files" type="file" multiple webkitdirectory style="display:none;"/>
<button id="uploadBtn">Upload to Selected Album</button>

<div id="status" class="status"></div>
<div id="albumsContainer"></div>
</div>

<script>
let currentAlbum = null;
let selectedFiles = [];

// ===== Drag & Drop =====
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('files');
dropArea.addEventListener('click', ()=>fileInput.click());
dropArea.addEventListener('dragover', e=>{e.preventDefault(); dropArea.classList.add('dragover');});
dropArea.addEventListener('dragleave', e=>{e.preventDefault(); dropArea.classList.remove('dragover');});
dropArea.addEventListener('drop', e=>{e.preventDefault(); dropArea.classList.remove('dragover'); selectedFiles = Array.from(e.dataTransfer.files); renderPreview();});
fileInput.addEventListener('change', e=>{selectedFiles = Array.from(e.target.files); renderPreview();});

// ===== Preview =====
function renderPreview(){
  dropArea.innerHTML = selectedFiles.length ? '' : 'Drag & Drop files/folder here or click to select';
  selectedFiles.forEach(f=>{
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.style.width='80px'; img.style.height='80px'; img.style.objectFit='cover'; img.style.margin='4px';
    dropArea.appendChild(img);
  });
}

// ===== Helpers =====
const readFileAsBase64 = file => new Promise((res,rej)=>{
  const reader = new FileReader();
  reader.onload = ()=>res({name:file.webkitRelativePath||file.name, contentBase64:reader.result.split(',')[1]});
  reader.onerror = rej;
  reader.readAsDataURL(file);
});

function addPhotoCard(container, file, theme){
  const div = document.createElement('div'); 
  div.className='card'; div.dataset.path=file.path; div.dataset.sha=file.sha||'';
  const img = document.createElement('img'); 
  img.src=`https://raw.githubusercontent.com/elieassaf33/alisosfotografija/main/${file.path}`;
  div.appendChild(img);
  const btn = document.createElement('button'); 
  btn.textContent='Delete';
  btn.onclick=async()=>{
    div.remove(); 
    const albumDiv = div.closest('.album');
    if(albumDiv && albumDiv.querySelectorAll('.card').length===0) albumDiv.remove();
    try{ await fetch('/.netlify/functions/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:file.path,sha:file.sha,commitMessage:`Delete ${file.path}`})}); }catch(err){console.error(err);}
  };
  div.appendChild(btn);
  container.appendChild(div);
}

// ===== Load Albums =====
async function loadAlbums(albums=[], theme){
  const container = document.getElementById('albumsContainer');
  container.innerHTML='';
  for(const albumName of albums){
    const albumDiv = document.createElement('div'); albumDiv.className='album';
    const title = document.createElement('h4'); title.textContent=albumName; albumDiv.appendChild(title);
    const photosGrid = document.createElement('div'); photosGrid.className='existingPhotos';
    albumDiv.appendChild(photosGrid);
    container.appendChild(albumDiv);

    try{
      const resp = await fetch('/.netlify/functions/list',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({theme, album:albumName})
      });
      const json = await resp.json();
      if(json.ok && Array.isArray(json.files)){
        json.files.forEach(f=>{
          addPhotoCard(photosGrid,{path:f.path, sha:f.sha},theme);
        });
      }
    }catch(err){console.error(err);}
  }
}

// ===== Buttons =====
document.getElementById('loadAlbumBtn').addEventListener('click', async ()=>{
  const albumName = document.getElementById('albumName').value.trim();
  if(!albumName) return alert('Enter album name');
  currentAlbum = albumName;
  const theme = document.getElementById('themeSelect').value;
  await loadAlbums([albumName], theme);
});

document.getElementById('loadAllAlbumsBtn').addEventListener('click', async ()=>{
  const theme = document.getElementById('themeSelect').value;
  try{
    const resp = await fetch('/.netlify/functions/list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme})});
    const json = await resp.json();
    if(json.ok && Array.isArray(json.files)){
      const albums = json.files.filter(f=>f.type==='dir').map(f=>f.name);
      await loadAlbums(albums, theme);
    }
  }catch(err){console.error(err);}
});

// ===== Upload =====
document.getElementById('uploadBtn').addEventListener('click', async ()=>{
  if(!selectedFiles.length) return alert('Select files first');
  if(!currentAlbum) return alert('Load an album first');
  const theme = document.getElementById('themeSelect').value;
  const commitMsg = `Upload photos to ${currentAlbum}`;
  const statusEl = document.getElementById('status'); statusEl.textContent='Uploading...';

  for(const f of selectedFiles){
    const obj = await readFileAsBase64(f);
    const cleanName = obj.name.split('/').pop();
    obj.name = `${theme}/${currentAlbum}/${cleanName}`;

    try{
      const resp = await fetch('/.netlify/functions/upload',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pathPrefix:'static/images', commitMessage: commitMsg, files:[{name:obj.name, contentBase64:obj.contentBase64}]})
      });
      const json = await resp.json();
      if(json.ok && json.results[0].ok){
        statusEl.textContent=`Uploaded ${obj.name} ✅`;
        // Add immediately to album
        const albumsDiv = document.getElementById('albumsContainer').getElementsByClassName('album');
        for(const albumDiv of albumsDiv){
          if(albumDiv.querySelector('h4').textContent===currentAlbum){
            addPhotoCard(albumDiv.querySelector('.existingPhotos'),{path:`static/images/${obj.name}`, sha:json.results[0].commit}, theme);
            break;
          }
        }
      } else { console.error(json); statusEl.textContent=`Failed to upload ${obj.name} ❌`; }
    }catch(err){ console.error(err); statusEl.textContent=`Error uploading ${obj.name} ❌`; }
  }
  selectedFiles=[];
  renderPreview();
});
</script>
</body>
</html>
