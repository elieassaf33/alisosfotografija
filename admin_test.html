<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alisos Fotografija Admin</title>
<style>
  body { font-family: 'ubuntu light', sans-serif, Arial; background:#f6f4f1; margin:0; padding:2rem; color:#333; }
  h1 { text-align:center; margin-bottom:2rem; }
  .login { max-width:400px; margin:2rem auto; background:white; padding:2rem; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .login input { width:100%; padding:0.5rem; margin-bottom:1rem; border-radius:5px; border:1px solid #ccc; }
  .login button { width:100%; padding:0.7rem; border:none; background:#555; color:white; border-radius:5px; cursor:pointer; }
  .login button:hover { background:#222; }
  .error { color:red; text-align:center; margin-top:1rem; }
  .album { display:none; background:white; padding:1rem; margin-bottom:2rem; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .album h2 { margin-top:0; }
  .controls { margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap; }
  .controls button { padding:0.5rem 1rem; cursor:pointer; border:none; border-radius:6px; background:#555; color:white; transition:0.2s; }
  .controls button:hover { background:#222; }
  input[type="file"] { border-radius:6px; padding:0.3rem; }
  .images { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:10px; }
  .image-item { position:relative; border-radius:6px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,0.1); }
  .image-item img { width:100%; display:block; object-fit:cover; height:100px; }
  .image-item button { position:absolute; top:5px; right:5px; background:red; border:none; color:white; padding:2px 6px; border-radius:4px; cursor:pointer; font-size:12px; }
  .status { margin-top:0.5rem; color:green; }
</style>
</head>
<body>

<h1>Alisos Fotografija Admin</h1>

<div class="login" id="loginDiv">
  <input type="password" id="adminPassword" placeholder="Enter admin password">
  <button id="loginBtn">Login</button>
  <div class="error" id="loginError"></div>
</div>

<div id="albumsContainer"></div>

<script>
const ALBUMS = ["Events", "Studio", "Portrait", "Family"];
let githubToken = null;
const GITHUB_REPO = "elieassaf33/alisosfotografija"; // replace if needed
const GITHUB_BRANCH = "main";
const IMAGE_FOLDER = "static/images";

// -------------------------
// Login
// -------------------------
document.getElementById("loginBtn").addEventListener("click", async () => {
  const password = document.getElementById("adminPassword").value;
  const errorDiv = document.getElementById("loginError");
  errorDiv.innerText = "";

  if (!password) { errorDiv.innerText = "Enter password"; return; }

  try {
    const resp = await fetch("/.netlify/functions/getUploadToken", {
      method: "GET",
      headers: { "X-Admin-Pass": password }
    });

    const data = await resp.json();
    if (!data.token) { 
      errorDiv.innerText = "Wrong password!";
      return;
    }

    githubToken = data.token;
    document.getElementById("loginDiv").style.display = "none";
    renderAlbums();

  } catch(err) {
    console.error(err);
    errorDiv.innerText = "Login failed. Try again.";
  }
});

// -------------------------
// Render albums
// -------------------------
function renderAlbums() {
  const container = document.getElementById("albumsContainer");
  container.innerHTML = "";
  ALBUMS.forEach(album => {
    const div = document.createElement("div");
    div.className = "album";
    div.id = `album-${album}`;
    div.style.display = "block"; // show after login
    div.innerHTML = `
      <h2>${album}</h2>
      <div class="controls">
        <input type="file" multiple id="fileInput-${album}" />
        <button onclick="uploadAlbum('${album}')">Upload</button>
        <button onclick="deleteAlbum('${album}')">Delete Whole Album</button>
        <span class="status" id="status-${album}"></span>
      </div>
      <div class="images" id="images-${album}"></div>
    `;
    container.appendChild(div);
    loadAlbumImages(album);
  });
}

// -------------------------
// Convert file to Base64
// -------------------------
function fileToBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

// -------------------------
// Upload image
// -------------------------
async function uploadAlbum(album) {
  const input = document.getElementById(`fileInput-${album}`);
  const files = Array.from(input.files);
  if (!files.length) return alert("Select files first!");
  const status = document.getElementById(`status-${album}`);
  status.innerText = "Uploading...";

  try {
    for (let file of files) {
      const base64 = await fileToBase64(file);
      const path = `${IMAGE_FOLDER}/${album}/${encodeURIComponent(file.name)}`;
      
      // Get SHA if file exists
      let sha;
      const checkResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`, {
        headers: { Authorization: `token ${githubToken}` }
      });
      if (checkResp.status === 200) sha = (await checkResp.json()).sha;

      // Upload / update
      const uploadResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
        method:"PUT",
        headers:{ Authorization: `token ${githubToken}`, "Content-Type":"application/json" },
        body: JSON.stringify({ message:`Upload ${file.name}`, content:base64, branch:GITHUB_BRANCH, sha })
      });
      if (![200,201].includes(uploadResp.status)) console.error(await uploadResp.json());
    }
    status.innerText = "Upload complete!";
    input.value = "";
    loadAlbumImages(album);
  } catch(err) {
    console.error(err);
    status.innerText = "Upload failed: "+err.message;
  }
}

// -------------------------
// Load album images
// -------------------------
async function loadAlbumImages(album) {
  const imagesDiv = document.getElementById(`images-${album}`);
  imagesDiv.innerHTML = "Loading...";
  try {
    const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${IMAGE_FOLDER}/${album}?ref=${GITHUB_BRANCH}`, {
      headers: { Authorization: `token ${githubToken}` }
    });
    const files = await resp.json();
    imagesDiv.innerHTML = "";
    if (!Array.isArray(files) || !files.length) {
      imagesDiv.innerHTML = "<em>No images uploaded yet.</em>";
      return;
    }
    files.forEach(file => {
      const div = document.createElement("div");
      div.className = "image-item";
      div.innerHTML = `<img src="${file.download_url}" alt="${file.name}" />
                       <button onclick='deleteImage("${file.path}","${album}")'>×</button>`;
      imagesDiv.appendChild(div);
    });
  } catch(err) {
    imagesDiv.innerText = "Error loading images: "+err.message;
  }
}

// -------------------------
// Delete single image
// -------------------------
async function deleteImage(path, album) {
  if (!confirm("Delete this image?")) return;
  const status = document.getElementById(`status-${album}`);
  status.innerText = "Deleting...";
  try {
    const shaResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`, {
      headers: { Authorization: `token ${githubToken}` }
    });
    const sha = (await shaResp.json()).sha;

    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
      method: "DELETE",
      headers: { Authorization: `token ${githubToken}`, "Content-Type":"application/json" },
      body: JSON.stringify({ message:`Delete ${path}`, branch:GITHUB_BRANCH, sha })
    });

    await new Promise(r=>setTimeout(r,300)); // wait for GitHub
    status.innerText = "Deleted!";
    loadAlbumImages(album);
  } catch(err) {
    status.innerText = "Delete failed: "+err.message;
  }
}

// -------------------------
// Delete whole album
// -------------------------
async function deleteAlbum(album) {
  if (!confirm(`Delete all images in ${album}?`)) return;
  const status = document.getElementById(`status-${album}`);
  status.innerText = "Deleting album...";
  try {
    const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${IMAGE_FOLDER}/${album}?ref=${GITHUB_BRANCH}`, {
      headers: { Authorization: `token ${githubToken}` }
    });
    const files = await resp.json();
    for (let file of files) {
      await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${file.path}`, {
        method: "DELETE",
        headers: { Authorization: `token ${githubToken}`, "Content-Type":"application/json" },
        body: JSON.stringify({ message:`Delete ${file.path}`, branch:GITHUB_BRANCH, sha:file.sha })
      });
      await new Promise(r=>setTimeout(r,200));
    }
    status.innerText = "Album deleted!";
    loadAlbumImages(album);
  } catch(err) {
    status.innerText = "Delete failed: "+err.message;
  }
}
</script>

</body>
</html>
