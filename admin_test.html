<!-- admin-upload.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Admin Upload to Git</title>
  <style>body{font-family:sans-serif;max-width:800px;margin:2rem;} .preview img{max-width:150px;margin:6px}</style>
</head>
<body>
  <h2>Upload images to repo (static)</h2>

  <label>Path prefix (inside repo) e.g. static/images/posts</label><br/>
  <input id="pathPrefix" type="text" value="static/images" style="width:60%"/>

  <br/><br/>
  <input id="files" type="file" multiple accept="image/*"/>
  <br/><br/>
  <input id="commitMsg" type="text" placeholder="Commit message" style="width:60%" value="Add images via admin"/>
  <br/><br/>
  <button id="uploadBtn">Upload & Commit</button>

  <h3>Status</h3>
  <div id="status"></div>

  <h3>Preview</h3>
  <div id="preview" class="preview"></div>

<script>
document.getElementById('files').addEventListener('change', (e) => {
  const p = document.getElementById('preview');
  p.innerHTML = '';
  for (const file of e.target.files) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    p.appendChild(img);
  }
});

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const files = document.getElementById('files').files;
  if (!files.length) return alert('Choose files first');
  const pathPrefix = document.getElementById('pathPrefix').value || 'static/images';
  const commitMsg = document.getElementById('commitMsg').value || 'Add images via admin';

  const statusEl = document.getElementById('status');
  statusEl.innerHTML = 'Reading files...';

  // read files as base64
  const readFileAsBase64 = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => {
      // reader.result is "data:<mime>;base64,AAAA..."
      const base64 = reader.result.split(',')[1];
      res({ name: file.name, contentBase64: base64 });
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });

  const toUpload = [];
  for (const f of files) {
    statusEl.innerHTML = `Reading ${f.name}...`;
    const obj = await readFileAsBase64(f);
    toUpload.push(obj);
  }

  statusEl.innerHTML = `Uploading ${toUpload.length} file(s)...`;

  // send to serverless function
  try {
    const resp = await fetch('/.netlify/functions/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pathPrefix,
        commitMessage: commitMsg,
        files: toUpload
      })
    });
    const json = await resp.json();
    if (!json.ok) {
      statusEl.innerHTML = 'Upload failed: ' + (json.error || JSON.stringify(json));
      return;
    }
    const lines = json.results.map(r => r.ok ? `✔ ${r.name} -> ${r.path}` : `✖ ${r.name} : ${JSON.stringify(r.error)}`);
    statusEl.innerHTML = '<pre>' + lines.join('\n') + '</pre>';
  } catch (err) {
    statusEl.innerHTML = 'Error: ' + err.message;
  }
});
</script>
</body>
</html>
