<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studija</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #333;
        }

        .section-description {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }

        .photo-grid {
            display: grid;
            grid-auto-rows: 400px; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            grid-auto-flow: dense;
        }

        .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #f4f4f4;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-image:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <img class="logo" src="logo.png" alt="Alisos Fotografija" style="height: 100px; width: auto;">
            <button class="menu-toggle" aria-label="Perjungti meniu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <nav class="nav-container">
                <ul class="nav">
                    <li><a href="index.html">Pradžia</a></li>
                    <li class="portfolio-dropdown">
                        <a href="portfolio.html">Portfolio</a>
                        <div class="portfolio-dropdown-content">
                            <a href="studio.html">Studija</a>
                            <a href="portrait.html">Portretai</a>
                            <a href="family.html">Šeima</a>
                            <a href="events.html">Vestuvės</a>
                        </div>       
                    </li>
                    <li><a href="prices.html">Kainos</a></li>
                    <li><a href="about.html">Apie</a></li>
                    <li><a href="reviews.html">Atsiliepimai</a></li>
                    <li><a href="contacts.html">Kontaktai</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="gallery-container">
            <h1 class="section-title">Studijos Fotografija</h1>
            <p class="section-description"></p>
            
            <div class="photo-grid" id="photoGrid">
                <!-- Photos will be loaded here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; Alisos Fotografija. Nuotraukų naudojimas galimas tik su autorės sutikimu.</p>
    </footer>

    <script src="js/scripts.js"></script>
    <script src="js/lightbox.js"></script>
    <script type="module">
        // Initialize lightbox
        initializeLightbox();

        const photoGrid = document.getElementById('photoGrid');
        const category = 'studio';
        const localCacheKey = `photos_${category}`;

        // --- Render single photo element ---
        function renderPhoto(data, index) {
            const photoItem = document.createElement('div');
            photoItem.className = 'photo-item';
            photoItem.innerHTML = `
                <div class="image-container">
                    <img 
                        src="${data.thumb || data.url}" 
                        data-full="${data.url}" 
                        alt="${data.caption || ''}" 
                        class="gallery-image lazy"
                        loading="lazy"
                    >
                </div>
            `;
            const img = photoItem.querySelector('img');
            img.addEventListener('click', () => {
                const index = Array.from(photoGrid.children).indexOf(photoItem);
                if (index !== -1) {
                    showLightbox(index);
                }
            });
            return photoItem;
        }

        // --- Load cached version first ---
        const cachedPhotos = JSON.parse(localStorage.getItem(localCacheKey) || '[]');
        if (cachedPhotos.length > 0) {
            cachedPhotos.forEach((p, i) => photoGrid.appendChild(renderPhoto(p, i)));
        }

        // --- Fetch from JSON file (fast, CDN cached) ---
        fetch('/data/studio.json')
            .then(res => res.json())
            .then(photos => {
                if (JSON.stringify(photos) !== JSON.stringify(cachedPhotos)) {
                    photoGrid.innerHTML = '';
                    photos.forEach((p, i) => photoGrid.appendChild(renderPhoto(p, i)));
                    localStorage.setItem(localCacheKey, JSON.stringify(photos));
                }
            })
            .catch(err => {
                console.error('Failed to load photos:', err);
            });
    </script>
</body>
</html>
