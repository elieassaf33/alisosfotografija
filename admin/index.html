<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>Admin Upload</title>
<style>
body { font-family: sans-serif; padding: 20px; }
input, button { margin: 10px 0; display: block; }
.album-list { margin-top: 20px; }
.album-card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>Upload Album</h1>

<label for="category">Category:</label>
<select id="category">
  <option value="studio">Studija</option>
  <option value="family">Šeima</option>
  <option value="portrait">Portretai</option>
  <option value="events">Renginiai</option>
</select>

<label for="zipFile">Select ZIP file:</label>
<input type="file" id="zipFile" accept=".zip">
<button id="uploadBtn">Upload Album</button>
<div id="status"></div>

<h2>Existing Albums</h2>
<div id="albumList" class="album-list"></div>

<script type="module">
const uploadBtn = document.getElementById('uploadBtn');
const zipInput = document.getElementById('zipFile');
const categorySelect = document.getElementById('category');
const status = document.getElementById('status');
const albumList = document.getElementById('albumList');

// Load albums
async function loadAlbums() {
  albumList.innerHTML = 'Loading...';
  try {
    const category = categorySelect.value;
    const res = await fetch(`/data/${category}.json`);
    const albums = await res.json();
    albumList.innerHTML = '';
    albums.forEach(a => {
      const card = document.createElement('div');
      card.className = 'album-card';
      card.innerHTML = `<strong>${a.album}</strong> 
        <button data-album="${a.album}">Delete</button>`;
      card.querySelector('button').addEventListener('click', async e => {
        if(confirm(`Delete album ${a.album}?`)){
          const delRes = await fetch(`/api/delete-album?category=${category}&album=${a.album}`, { method: 'POST' });
          if(delRes.ok) loadAlbums();
        }
      });
      albumList.appendChild(card);
    });
  } catch(e) {
    albumList.innerHTML = 'Failed to load albums';
    console.error(e);
  }
}

// Upload ZIP
uploadBtn.addEventListener('click', async () => {
  const file = zipInput.files[0];
  const category = categorySelect.value;
  if(!file) return alert('Select a ZIP file!');
  const formData = new FormData();
  formData.append('zip', file);
  formData.append('category', category);
  status.textContent = 'Uploading...';
  try {
    const res = await fetch('/api/upload-album', { method: 'POST', body: formData });
    if(res.ok){
      status.textContent = 'Upload successful!';
      loadAlbums();
    } else {
      status.textContent = 'Upload failed';
    }
  } catch(e){
    console.error(e);
    status.textContent = 'Upload failed';
  }
});

loadAlbums();
</script>
</body>
</html>
