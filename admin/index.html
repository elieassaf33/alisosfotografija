<h1>Admin Panel</h1>

<h2>Create Album</h2>
<label>Album Title: <input type="text" id="albumTitle"></label><br>
<label>Category:
  <select id="albumCategory">
    <option value="studio">Studio</option>
    <option value="family">Family</option>
    <option value="portrait">Portrait</option>
    <option value="events">Events</option>
  </select>
</label><br>
<label>Select Photos (folder): <input type="file" id="albumFiles" multiple webkitdirectory></label><br>
<button id="uploadAlbum">Upload Album</button>

<h2>Existing Albums</h2>
<div id="existingAlbums"></div>

<script src="admin.js"></script>
