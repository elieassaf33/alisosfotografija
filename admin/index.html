<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Alisos Fotografija</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<h1>Admin Panel</h1>

<label>Album Title: <input type="text" id="albumTitle"></label><br>
<label>Category:
  <select id="albumCategory">
    <option value="studio">Studio</option>
    <option value="family">Family</option>
    <option value="portrait">Portrait</option>
    <option value="events">Events</option>
  </select>
</label><br>
<label>Photos: <input type="file" id="photos" multiple></label><br>
<button id="createAlbumBtn">Create Album JSON</button>

<p>Instructions: After downloading the JSON, upload it to <code>/gallery-data/</code> and your images to <code>/images/uploads/</code>.</p>

<script src="js/admin.js"></script>
</body>
</html>
