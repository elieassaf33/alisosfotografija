<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alisos Fotografija Admin</title>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.9.0/dist/decap-cms.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <script>
        // ✅ localStorage fallback if blocked by browser
        function storageAvailable(type) {
            try {
                var storage = window[type],
                    x = '__storage_test__';
                storage.setItem(x, x);
                storage.removeItem(x);
                return true;
            }
            catch(e) {
                return false;
            }
        }

        if (!storageAvailable('localStorage')) {
            window.localStorage = {
                _data: {},
                setItem: function(k,v){ this._data[k]=v; },
                getItem: function(k){ return this._data[k] || null; },
                removeItem: function(k){ delete this._data[k]; },
                clear: function(){ this._data = {}; }
            };
            console.warn('LocalStorage blocked — using in-memory fallback.');
        }
    </script>
</body>
</html>
